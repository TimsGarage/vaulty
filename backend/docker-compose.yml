services:
  vaulty-backend:
    container_name: vaulty-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required: set API_KEY in your shell or a .env file next to this compose file.
      # Generate one with: openssl rand -hex 32
      - API_KEY=${API_KEY:?Set API_KEY (e.g. openssl rand -hex 32) before starting}
      - VAULT_DIR=/data/vault
      - GIN_MODE=release
      - TZ=Europe/Berlin
    volumes:
      - ./data:/data/vault